<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="FELISH — alt R&amp;B. New single All My Exes out now." />
    <meta name="theme-color" content="#efe8dc" />
    <title>FELISH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300..700&family=Manrope:wght@400..700&display=swap"
    />
  </head>
  <body class="home">
    <header class="bar">
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <a class="moon" id="moon" href="./space.html" aria-label="Enter the moon: the 3D world">
        <span class="moon-label">Enter the moon</span>
        <canvas class="moon-disc" width="56" height="56" aria-hidden="true"></canvas>
      </a>
    </header>

    <main class="stage">
      <h1 class="name" id="name">FELISH</h1>
      <figure class="photo">
        <img
          src="./src/home/felish-cloud.jpg"
          srcset="./src/home/felish-cloud-small.jpg 800w, ./src/home/felish-cloud.jpg 1600w"
          sizes="(min-width: 900px) 720px, 100vw"
          width="1600"
          height="909"
          alt="Felish sitting in the grass with a cream electric guitar, looking back over her shoulder"
        />
      </figure>
      <section class="credits" aria-label="Live performances">
        <div class="credits-roll" id="credits"></div>
      </section>
      <section class="release" id="release" aria-label="Latest release"></section>
    </main>

    <footer class="foot">
      <ul class="socials" id="socials"></ul>
      <p class="copy">© 2026 Felish</p>
    </footer>

    <canvas class="sky" id="sky" aria-hidden="true"></canvas>
    <div class="moon-wipe" id="moon-wipe" aria-hidden="true"></div>
    <script type="module" src="/src/home/home.js"></script>
  </body>
</html>
